# Prospector Default Configuration
# =================================
# Copy this file to config/local.yaml and customize for your needs

# Trucking Industry Settings
trucking:
  # Target states (use state abbreviations)
  target_states:
    - FL
    - GA
    - IL
    - TX
    - CA
    - NC
    - TN
    - OH
    - PA
    - NJ
    - NY

  # Fleet size filters
  min_power_units: 1
  max_power_units: 50

  # Carrier operation types
  # A = Interstate carrier
  # B = Intrastate Hazmat
  # C = Intrastate Non-Hazmat
  carrier_operation:
    - A
    - B

  # Entity types
  # C = Carrier
  # B = Broker
  # F = Freight Forwarder
  entity_types:
    - C

  # API settings
  max_records_per_state: 10000

# Scoring Settings
scoring:
  base_score: 50
  hot_threshold: 70
  medium_threshold: 50

  # Fleet size scoring (trucking)
  fleet_sweet_spot:
    min: 5
    max: 20
    points: 30

  fleet_small:
    min: 2
    max: 4
    points: 20

  fleet_medium:
    min: 21
    max: 35
    points: 15

  fleet_single:
    min: 1
    max: 1
    points: 5

  # Contact info scoring
  has_phone_points: 10
  has_mc_authority_points: 10

# Output Settings
output:
  default_format: csv  # csv or excel
  include_hot_file: true
  hot_threshold: 70

# MCA Scoring Settings
# ===================
# Industry-specific scoring profiles for Merchant Cash Advance prospecting
mca_scoring:
  # Default industry if not auto-detected
  default_industry: general

  # Enable UCC cross-referencing during scoring
  enable_ucc_crossref: true

  # States to search for UCC filings
  ucc_crossref_states:
    - CT
    - OR
    - CO

  # UCC name match threshold (0.0-1.0)
  ucc_match_threshold: 0.80

  # Score thresholds for risk tiers
  risk_tiers:
    prime: 80      # A tier - best prospects
    standard: 65   # B tier - solid prospects
    moderate: 50   # C tier - worth a call
    higher_risk: 35 # D tier - lower priority

# API Settings (optional)
# Set these for higher rate limits and enrichment features
api:
  # Socrata app token (get one at https://data.transportation.gov)
  # Can also be set via SOCRATA_APP_TOKEN environment variable
  socrata_app_token: null

  # SAM.gov API key (get one at https://sam.gov/developers)
  # Can also be set via SAM_API_KEY environment variable
  sam_api_key: null

  # OpenCorporates API key (optional, free tier at https://opencorporates.com/api_accounts/new)
  # Can also be set via OPENCORPORATES_API_KEY environment variable
  opencorporates_api_key: null

  # Google Places API key (get one at https://console.cloud.google.com)
  # Can also be set via GOOGLE_PLACES_API_KEY environment variable
  # Pricing: ~$0.017/basic request, ~$0.032/detail request
  google_places_api_key: null

  # Yelp Fusion API key (get one at https://www.yelp.com/developers)
  # Can also be set via YELP_API_KEY environment variable
  # Free tier: 5,000 calls/day
  yelp_api_key: null

  # Rate limiting
  requests_per_second: 2
  retry_attempts: 3
  retry_backoff: 2  # Exponential backoff multiplier
